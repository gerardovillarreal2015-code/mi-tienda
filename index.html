<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Tienda · Administración</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#1c2a27;--muted:#6b7a76;--side:#17352e;--side-ink:#cfe0db;--accent:#e0a526;--line:#dfe5e3;--err:#a8321f}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
aside h1{font-size:19px;color:#fff;padding:0 10px 20px}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;margin-bottom:3px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.active{background:var(--accent);color:#1c2a27;font-weight:700}
main{flex:1;padding:32px;max-width:1100px}
h2{font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;overflow-x:auto}
form.fila{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
input,select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);min-width:150px}
button{padding:9px 16px;border:0;border-radius:8px;background:var(--side);color:#fff;font:inherit;font-weight:500;cursor:pointer}
button:hover{background:#0f2520}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.msg{padding:14px;border-radius:8px;background:#fbefec;color:var(--err);margin-bottom:12px}
.vacio{color:var(--muted);padding:12px 0}
.login{max-width:360px}
.sec{font-weight:700;margin:6px 0 8px}
.lineas{display:flex;flex-direction:column;gap:8px;width:100%}
.linea{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.total{font-size:18px;font-weight:700;align-self:center}
.subt{align-self:center;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;padding:12px}
nav{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap;margin:0}aside h1{padding-bottom:10px}main{padding:18px}}
</style>
</head>
<body>
<aside><h1>Mi Tienda</h1><nav id="menu"></nav></aside>
<main id="app"></main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(n)||0);
const TZ = "America/Bogota";
const fecha = f => f ? new Date(f).toLocaleString("es-CO", {timeZone: TZ, dateStyle: "short", timeStyle: "short"}) : "";
const soloFecha = f => f ? String(f).slice(0, 10).split("-").reverse().join("/") : "";
const diaCO = f => new Date(f).toLocaleDateString("en-CA", {timeZone: TZ});

async function api(tabla, method = "GET", body) {
  let r;
  try {
    r = await fetch(`/api?tabla=${tabla}`, {
      method,
      headers: {"x-admin-key": sessionStorage.getItem("k") || "", "Content-Type": "application/json"},
      body: body ? JSON.stringify(body) : undefined
    });
  } catch { throw new Error("SIN_SERVIDOR"); }
  if (r.status === 401) { sessionStorage.removeItem("k"); throw new Error("AUTH"); }
  if (r.status === 404) throw new Error("SIN_SERVIDOR");
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Error inesperado");
  return d;
}

const error = e => ({
  SIN_SERVIDOR: "No se pudo conectar con el servidor. Abre el sitio desde su dirección de Netlify (no desde el archivo en tu computador) y revisa que la función esté desplegada.",
}[e.message] || "No se pudo completar la acción: " + esc(e.message));

/* Configuración de cada módulo: tabla, columnas a mostrar y campos del formulario */
const CFG = {
  categorias:{nombre:"Categorías",sub:"Agrupa tus productos (licores, bebidas, mecatos…)",tabla:"categorias",boton:"Agregar categoría",
    cols:[["nombre","Categoría"],["productos","Productos"]],
    campos:[{k:"nombre",l:"Nombre de la categoría",req:1}]},
  productos:{nombre:"Productos",sub:"Catálogo: lo que pagaste por la compra, las unidades, y el precio al público",tabla:"productos",boton:"Agregar producto",
    cols:[["codigo","Código"],["nombre","Producto"],["categoria","Categoría"],["precio_total_compra","Precio total de compra","$"],["unidades_compra","Unidades compradas"],
      ["precio_compra","Precio unitario de compra","$"],["precio_venta","Precio de venta al público","$"],["ganancia","Ganancia por unidad","$"],["stock","Stock"]],
    campos:[{k:"codigo",l:"Código"},{k:"nombre",l:"Producto",req:1},{k:"categoria_id",l:"Categoría",t:"select",src:"categorias",ver:"nombre",req:1},
      {k:"precio_total_compra",l:"Precio total de compra",t:"number",req:1},{k:"unidades_compra",l:"Unidades compradas",t:"number",req:1},
      {k:"precio_venta",l:"Precio de venta al público (por unidad)",t:"number",req:1},{k:"stock_minimo",l:"Stock mínimo",t:"number"}],
    hint:{total:"precio_total_compra",unidades:"unidades_compra",texto:"Precio unitario de compra"}},
  inventario:{nombre:"Inventario",sub:"Compras y ajustes de stock. El stock de cada producto sale de aquí",tabla:"inventario_movimientos",boton:"Registrar movimiento",
    cols:[["fecha","Fecha","f"],["tipo","Tipo"],["producto","Producto"],["proveedor","Proveedor"],["cantidad","Unidades"],
      ["precio_total","Precio total","$"],["costo_unitario","Precio unitario","$"],["fecha_vencimiento","Vence","d"]],
    campos:[{k:"producto_id",l:"Producto",t:"select",src:"productos",ver:"nombre",req:1},
      {k:"proveedor_id",l:"Proveedor (opcional)",t:"select",src:"proveedores",ver:"empresa"},
      {k:"tipo",l:"Tipo",t:"select",op:["Compra","Ajuste"]},
      {k:"cantidad",l:"Unidades compradas (ajuste: negativo si resta)",t:"number",req:1},{k:"precio_total",l:"Precio total pagado",t:"number"},
      {k:"fecha_vencimiento",l:"Fecha de vencimiento",t:"date"}],
    hint:{total:"precio_total",unidades:"cantidad",texto:"Precio unitario"}},
  ventas:{nombre:"Ventas",sub:"Productos vendidos, cantidad y total (precio de venta × cantidad). Hora de Colombia",tabla:"ventas",
    cols:[["id","N°"],["fecha","Fecha y hora","f"],["cliente","Cliente"],["detalle","Productos"],["unidades","Unidades"],["total","Total","$"],["debe","Debe","$"]],campos:[]},
  clientes:{nombre:"Clientes",sub:"Tus compradores y lo que te deben",tabla:"clientes",boton:"Agregar cliente",
    cols:[["id","N°"],["nombre","Nombre"],["telefono","Teléfono"],["correo","Correo"],["deuda","Deuda","$"]],
    campos:[{k:"nombre",l:"Nombre",req:1},{k:"telefono",l:"Teléfono"},{k:"correo",l:"Correo"}],
    extra:{tabla:"abonos",titulo:"Registrar abono a una deuda",boton:"Registrar abono",
      campos:[{k:"cliente_id",l:"Cliente",t:"select",src:"clientes",ver:"nombre",req:1},{k:"monto",l:"Monto del abono",t:"number",req:1}]}},
  proveedores:{nombre:"Proveedores",sub:"Quién te surte",tabla:"proveedores",boton:"Agregar proveedor",
    cols:[["empresa","Empresa"],["contacto","Contacto"],["telefono","Teléfono"]],
    campos:[{k:"empresa",l:"Empresa",req:1},{k:"contacto",l:"Contacto"},{k:"telefono",l:"Teléfono"}]},
  caja:{nombre:"Caja",sub:"Ingresos y egresos del día",tabla:"caja_movimientos",boton:"Registrar movimiento",
    cols:[["fecha","Fecha y hora","f"],["concepto","Concepto"],["tipo","Tipo"],["monto","Monto","$"]],
    campos:[{k:"concepto",l:"Concepto",req:1},{k:"tipo",l:"Tipo",t:"select",op:["Ingreso","Egreso"]},{k:"monto",l:"Monto",t:"number",req:1}]}
};

const celda = (v, t) => t === "$" ? money(v) : t === "f" ? fecha(v) : t === "d" ? soloFecha(v) : esc(v);
const stat = (n, t) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`;
const encabezado = (t, s) => `<h2>${t}</h2><p class="sub">${s}</p>`;

const VISTAS = {
  ventas: () => vistaVentas(),
  vencimientos: () => vistaVencimientos(),
  async dashboard() {
    const [p, c, v, k, l] = await Promise.all(["productos","clientes","ventas","caja_movimientos","lotes"].map(t => api(t)));
    const hoy = diaCO(new Date());
    const ventasHoy = v.filter(x => diaCO(x.fecha) === hoy).reduce((a,x) => a + Number(x.total), 0);
    const saldo = k.reduce((a,x) => a + (x.tipo === "Ingreso" ? 1 : -1) * Number(x.monto), 0);
    const porCobrar = c.reduce((a,x) => a + Number(x.deuda), 0);
    const bajo = p.filter(x => Number(x.stock) <= Number(x.stock_minimo));
    const venc = l.filter(x => Number(x.dias_restantes) <= 5).length;
    return encabezado("Dashboard","Resumen de tu tienda") +
      `<div class="stats">${stat(money(ventasHoy),"Ventas de hoy")}${stat(bajo.length,"Productos con stock bajo")}${stat(venc,"Compras vencidas o por vencer (5 días)")}${stat(money(porCobrar),"Por cobrar a clientes")}${stat(money(saldo),"Saldo en caja")}${stat(c.length,"Clientes registrados")}</div>` +
      `<div class="box"><b>Últimas ventas</b>${tablaHTML([["id","N°"],["fecha","Fecha y hora","f"],["cliente","Cliente"],["unidades","Unidades"],["total","Total","$"],["debe","Debe","$"]], v.slice(0,5))}</div>`;
  },
  async reportes() {
    const [p, v, k, c, it] = await Promise.all(["productos","ventas","caja_movimientos","clientes","venta_items"].map(t => api(t)));
    const suma = (arr, f) => arr.reduce((a,x) => a + f(x), 0);
    const caja = tipo => suma(k.filter(x => x.tipo === tipo), x => Number(x.monto));
    const acum = {};
    it.forEach(x => {
      const r = acum[x.producto_id] ||= {producto: x.producto, cantidad: 0, ganancia: 0};
      r.cantidad += Number(x.cantidad); r.ganancia += Number(x.ganancia);
    });
    const top = Object.values(acum).sort((a, b) => b.cantidad - a.cantidad).slice(0, 5);
    return encabezado("Reportes","Totales de la tienda") + `<div class="stats">${
      stat(money(suma(v, x => Number(x.total))),"Total vendido")}${
      stat(money(suma(it, x => Number(x.ganancia))),"Ganancia de las ventas")}${
      stat(money(suma(p, x => x.stock * x.precio_compra)),"Inventario a precio de compra")}${
      stat(money(suma(p, x => x.stock * x.precio_venta)),"Inventario a precio de venta")}${
      stat(money(suma(p, x => x.stock * x.ganancia)),"Ganancia potencial del inventario")}${
      stat(money(caja("Ingreso")),"Ingresos en caja")}${
      stat(money(caja("Egreso")),"Egresos en caja")}${
      stat(money(suma(c, x => Number(x.deuda))),"Por cobrar a clientes")}</div>
      <div class="box"><b>Productos más vendidos</b>${tablaHTML([["producto","Producto"],["cantidad","Unidades vendidas"],["ganancia","Ganancia","$"]], top)}</div>`;
  }
};

function tablaHTML(cols, filas, attr) {
  if (!filas.length) return `<p class="vacio">Aún no hay registros.</p>`;
  return `<table><tr>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr>${
    filas.map(f => `<tr${attr ? attr(f) : ""}>${cols.map(c => `<td>${celda(f[c[0]], c[2])}</td>`).join("")}</tr>`).join("")}</table>`;
}

async function vistaModulo(id) {
  const m = CFG[id];
  HINT = m.hint || null;
  const todos = [...m.campos, ...(m.extra ? m.extra.campos : [])];
  const fuentes = [...new Set(todos.filter(c => c.src).map(c => c.src))];
  const [filas, ...listas] = await Promise.all([api(m.tabla), ...fuentes.map(f => api(f))]);
  const datos = Object.fromEntries(fuentes.map((f, i) => [f, listas[i]]));
  const opciones = c => c.src ? datos[c.src].map(o => [o.id, o[c.ver]]) : c.op.map(o => [o, o]);
  const campo = c => `<label>${c.l}${c.t === "select"
    ? `<select name="${c.k}" ${c.req ? "required" : ""}>${c.src ? `<option value="" ${c.req ? "disabled selected" : ""}>${c.req ? "Elegir…" : "—"}</option>` : ""}${
        opciones(c).map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select>`
    : `<input name="${c.k}" type="${c.t || "text"}" ${c.t === "number" ? 'step="any"' : ""} ${c.req ? "required" : ""}>`}</label>`;
  const extra = m.extra ? `<p class="sec">${m.extra.titulo}</p><form class="fila" onsubmit="guardar(event,'${id}',1)">${m.extra.campos.map(campo).join("")}<button>${m.extra.boton}</button></form>` : "";
  const filtro = id === "productos" ? `<form class="fila" onsubmit="return false"><label>Filtrar por categoría<select onchange="filtrar(this.value)"><option value="">Todas las categorías</option>${
    datos.categorias.map(c => `<option>${esc(c.nombre)}</option>`).join("")}</select></label></form>` : "";
  const attr = id === "productos" ? f => ` data-cat="${esc(f.categoria || "")}"` : null;
  return encabezado(m.nombre, m.sub) + `<div class="box">
    <div id="aviso"></div>
    <form class="fila" ${m.hint ? 'oninput="hint(this)"' : ""} onsubmit="guardar(event,'${id}')">${m.campos.map(campo).join("")}<button>${m.boton}</button>${m.hint ? '<span class="total" id="hint"></span>' : ""}</form>
    ${extra}${filtro}
    ${tablaHTML(m.cols, filas, attr)}</div>`;
}

function filtrar(cat) {
  document.querySelectorAll("tr[data-cat]").forEach(tr => { tr.hidden = !!cat && tr.dataset.cat !== cat; });
}

async function guardar(ev, id, ex) {
  ev.preventDefault();
  const m = ex ? CFG[id].extra : CFG[id], datos = {};
  new FormData(ev.target).forEach((v, k) => { datos[k] = v === "" ? null : v; });
  try { await api(m.tabla, "POST", datos); mostrar(); }
  catch (e) { if (e.message === "AUTH") return mostrar(); document.getElementById("aviso").innerHTML = `<div class="msg">${error(e)}</div>`; }
}

let HINT = null;
function hint(f) {
  const t = Number(f[HINT.total].value), u = Number(f[HINT.unidades].value);
  document.getElementById("hint").textContent = u > 0 && t >= 0 ? `${HINT.texto}: ${money(t / u)}` : "";
}

let PRODS = [];
const lineaHTML = () => `<div class="linea"><label>Producto<select>${`<option value="">Elegir…</option>`}${
  PRODS.map(p => `<option value="${p.id}" ${p.stock <= 0 ? "disabled" : ""}>${esc(p.nombre)} · ${money(p.precio_venta)} · stock ${p.stock}</option>`).join("")}</select></label>
  <label>Cantidad<input type="number" min="1" step="1" value="1"></label>
  <span class="subt">Subtotal: ${money(0)}</span>
  <button type="button" onclick="this.parentNode.remove();calc()">Quitar</button></div>`;
const addLinea = () => document.getElementById("lineas").insertAdjacentHTML("beforeend", lineaHTML());
function calc() {
  let t = 0;
  document.querySelectorAll(".linea").forEach(l => {
    const p = PRODS.find(x => String(x.id) === l.querySelector("select").value);
    const sub = p ? Number(p.precio_venta) * (Number(l.querySelector("input").value) || 0) : 0;
    l.querySelector(".subt").textContent = "Subtotal: " + money(sub);
    t += sub;
  });
  const debe = Number(document.querySelector('[name="debe"]').value) || 0;
  document.getElementById("total").textContent = `Total: ${money(t)} · Paga ahora: ${money(Math.max(0, t - debe))} · Debe: ${money(debe)}`;
}

async function vistaVentas() {
  const m = CFG.ventas;
  const [filas, clientes, prods, items] = await Promise.all([api("ventas"), api("clientes"), api("productos"), api("venta_items")]);
  PRODS = prods;
  const colsItems = [["venta_id","Venta N°"],["fecha","Fecha y hora","f"],["cliente","Cliente"],["producto","Producto"],["cantidad","Cantidad"],["precio_unitario","Precio unitario","$"],["subtotal","Total","$"]];
  return encabezado(m.nombre, m.sub) + `<div class="box"><div id="aviso"></div>
    <form class="fila" oninput="calc()" onsubmit="guardarVenta(event)">
      <label>Cliente que compra<select name="cliente_id"><option value="">—</option>${
        clientes.map(c => `<option value="${c.id}">${esc(c.nombre)}</option>`).join("")}</select></label>
      <label>Debe (lo que queda fiado; 0 si pagó todo)<input name="debe" type="number" min="0" step="any" value="0"></label>
      <div class="lineas" id="lineas">${lineaHTML()}</div>
      <button type="button" onclick="addLinea()">+ Agregar otro producto</button>
      <span class="total" id="total">Total: ${money(0)}</span>
      <button>Registrar venta</button>
    </form>${tablaHTML(m.cols, filas)}</div>
    <div class="box" style="margin-top:16px"><b>Detalle de productos vendidos</b>${tablaHTML(colsItems, items)}</div>`;
}

async function guardarVenta(ev) {
  ev.preventDefault();
  const f = ev.target;
  const items = [...f.querySelectorAll(".linea")]
    .map(l => ({producto_id: l.querySelector("select").value, cantidad: l.querySelector("input").value}))
    .filter(i => i.producto_id);
  try { await api("ventas", "POST", {cliente_id: f.cliente_id.value || null, debe: f.debe.value || 0, items}); mostrar(); }
  catch (e) { if (e.message === "AUTH") return mostrar(); document.getElementById("aviso").innerHTML = `<div class="msg">${error(e)}</div>`; }
}

let DIAS = 5;
function cambiarDias(v) { DIAS = Math.max(0, Math.floor(Number(v)) || 0); mostrar(); }
async function vistaVencimientos() {
  const lotes = await api("lotes");
  const orden = (a, b) => a.dias_restantes - b.dias_restantes;
  const vencidos = lotes.filter(x => x.dias_restantes < 0).sort(orden)
    .map(x => ({...x, plazo: `Hace ${-x.dias_restantes} ${x.dias_restantes === -1 ? "día" : "días"}`}));
  const porVencer = lotes.filter(x => x.dias_restantes >= 0 && x.dias_restantes <= DIAS).sort(orden)
    .map(x => ({...x, plazo: x.dias_restantes === 0 ? "Vence hoy" : `En ${x.dias_restantes} ${x.dias_restantes === 1 ? "día" : "días"}`}));
  const uni = arr => arr.reduce((a, x) => a + Number(x.restante), 0);
  const cols = (titulo) => [["producto","Producto"],["categoria","Categoría"],["fecha_vencimiento","Vence","d"],["plazo",titulo],["restante","Unidades que quedan"]];
  const atajos = [3,5,7,15,30].map(n => `<button type="button" onclick="cambiarDias(${n})">${n} días</button>`).join("");
  return encabezado("Productos por vencer","Cada fila es una compra (lote) con fecha de vencimiento. Las ventas descuentan primero lo que vence antes") +
    `<div class="box"><form class="fila" onsubmit="return false">
      <label>Avisar con cuántos días de anticipación<input type="number" min="0" max="365" value="${DIAS}" onchange="cambiarDias(this.value)"></label>${atajos}</form>
      <div class="stats">${stat(uni(vencidos),"Unidades ya vencidas")}${stat(uni(porVencer),`Unidades que vencen en ${DIAS} días o menos`)}</div></div>
    <div class="box" style="margin-top:16px"><b>Por vencer en los próximos ${DIAS} días</b>${
      porVencer.length ? tablaHTML(cols("Vence"), porVencer) : `<p class="vacio">No hay productos por vencer en ese plazo.</p>`}</div>
    <div class="box" style="margin-top:16px"><b>Ya vencidos (con unidades en stock)</b>${
      vencidos.length ? tablaHTML(cols("Venció"), vencidos) : `<p class="vacio">No hay productos vencidos.</p>`}</div>`;
}

function login(aviso = "") {
  document.getElementById("app").innerHTML = encabezado("Iniciar sesión","Escribe la clave de administrador") +
    `<div class="box login">${aviso}<form class="fila" onsubmit="entrar(event)">
      <label>Clave<input type="password" name="k" required autofocus></label><button>Entrar</button></form></div>`;
}
async function entrar(ev) {
  ev.preventDefault();
  sessionStorage.setItem("k", new FormData(ev.target).get("k"));
  try { await api("productos"); mostrar(); }
  catch (e) { login(`<div class="msg">${e.message === "AUTH" ? "La clave no es correcta." : error(e)}</div>`); }
}

async function mostrar() {
  const h = location.hash.slice(1);
  if (h === "salir") { sessionStorage.removeItem("k"); location.hash = "dashboard"; return; }
  const id = (h in CFG || h in VISTAS) ? h : "dashboard";
  const orden = ["dashboard","categorias","productos","inventario","vencimientos","ventas","clientes","proveedores","reportes","caja"];
  const nombre = k => ({dashboard:"Dashboard", reportes:"Reportes", vencimientos:"Por vencer"})[k] || CFG[k].nombre;
  document.getElementById("menu").innerHTML = orden.map(k => `<a href="#${k}" class="${k === id ? "active" : ""}">${nombre(k)}</a>`).join("") + `<a href="#salir">Salir</a>`;
  document.title = nombre(id) + " · Mi Tienda";
  if (!sessionStorage.getItem("k")) return login();
  const app = document.getElementById("app");
  app.innerHTML = `<p class="sub">Cargando…</p>`;
  try { app.innerHTML = id in VISTAS ? await VISTAS[id]() : await vistaModulo(id); }
  catch (e) { if (e.message === "AUTH") return login(`<div class="msg">La clave no es correcta.</div>`); app.innerHTML = `<div class="msg">${error(e)}</div>`; }
}
addEventListener("hashchange", mostrar);
mostrar();
</script>
</body>
