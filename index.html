<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Tienda · Administración</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--panel:#fff;--ink:#1c2a27;--muted:#6b7a76;--side:#17352e;--side-ink:#cfe0db;--accent:#e0a526;--line:#dfe5e3;--err:#a8321f}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:230px;background:var(--side);color:var(--side-ink);padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
aside h1{font-size:19px;color:#fff;padding:0 10px 20px}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;margin-bottom:3px;font-weight:500}
nav a:hover{background:rgba(255,255,255,.08)}
nav a.active{background:var(--accent);color:#1c2a27;font-weight:700}
main{flex:1;padding:32px;max-width:1100px}
h2{font-size:26px;margin-bottom:4px}
.sub{color:var(--muted);margin-bottom:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat b{display:block;font-size:24px}.stat span{color:var(--muted);font-size:14px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;overflow-x:auto}
form.fila{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
input,select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink);min-width:150px}
button{padding:9px 16px;border:0;border-radius:8px;background:var(--side);color:#fff;font:inherit;font-weight:500;cursor:pointer}
button:hover{background:#0f2520}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500}
.msg{padding:14px;border-radius:8px;background:#fbefec;color:var(--err);margin-bottom:12px}
.vacio{color:var(--muted);padding:12px 0}
.login{max-width:360px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static;padding:12px}
nav{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap;margin:0}aside h1{padding-bottom:10px}main{padding:18px}}
</style>
</head>
<body>
<aside><h1>Mi Tienda</h1><nav id="menu"></nav></aside>
<main id="app"></main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Number(n)||0);
const fecha = f => f ? new Date(f).toLocaleDateString("es-CO") : "";

async function api(tabla, method = "GET", body) {
  let r;
  try {
    r = await fetch(`/api?tabla=${tabla}`, {
      method,
      headers: {"x-admin-key": sessionStorage.getItem("k") || "", "Content-Type": "application/json"},
      body: body ? JSON.stringify(body) : undefined
    });
  } catch { throw new Error("SIN_SERVIDOR"); }
  if (r.status === 401) { sessionStorage.removeItem("k"); throw new Error("AUTH"); }
  if (r.status === 404) throw new Error("SIN_SERVIDOR");
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Error inesperado");
  return d;
}

const error = e => ({
  SIN_SERVIDOR: "No se pudo conectar con el servidor. Abre el sitio desde su dirección de Netlify (no desde el archivo en tu computador) y revisa que la función esté desplegada.",
}[e.message] || "No se pudo completar la acción: " + esc(e.message));

/* Configuración de cada módulo: tabla, columnas a mostrar y campos del formulario */
const CFG = {
  inventario:{nombre:"Inventario",sub:"Productos y existencias",tabla:"productos",boton:"Agregar producto",
    cols:[["codigo","Código"],["nombre","Producto"],["stock","Stock"],["precio","Precio","$"]],
    campos:[{k:"codigo",l:"Código"},{k:"nombre",l:"Producto",req:1},{k:"stock",l:"Stock",t:"number"},{k:"precio",l:"Precio",t:"number"}]},
  ventas:{nombre:"Ventas",sub:"Historial de ventas",tabla:"ventas",boton:"Registrar venta",
    cols:[["id","N°"],["fecha","Fecha","f"],["cliente_id","Cliente N°"],["total","Total","$"]],
    campos:[{k:"total",l:"Total",t:"number",req:1},{k:"cliente_id",l:"N° de cliente (opcional)",t:"number"}]},
  clientes:{nombre:"Clientes",sub:"Tus compradores",tabla:"clientes",boton:"Agregar cliente",
    cols:[["id","N°"],["nombre","Nombre"],["telefono","Teléfono"],["correo","Correo"]],
    campos:[{k:"nombre",l:"Nombre",req:1},{k:"telefono",l:"Teléfono"},{k:"correo",l:"Correo"}]},
  proveedores:{nombre:"Proveedores",sub:"Quién te surte",tabla:"proveedores",boton:"Agregar proveedor",
    cols:[["empresa","Empresa"],["contacto","Contacto"],["telefono","Teléfono"]],
    campos:[{k:"empresa",l:"Empresa",req:1},{k:"contacto",l:"Contacto"},{k:"telefono",l:"Teléfono"}]},
  caja:{nombre:"Caja",sub:"Ingresos y egresos del día",tabla:"caja_movimientos",boton:"Registrar movimiento",
    cols:[["fecha","Fecha","f"],["concepto","Concepto"],["tipo","Tipo"],["monto","Monto","$"]],
    campos:[{k:"concepto",l:"Concepto",req:1},{k:"tipo",l:"Tipo",t:"select",op:["Ingreso","Egreso"]},{k:"monto",l:"Monto",t:"number",req:1}]}
};

const celda = (v, t) => t === "$" ? money(v) : t === "f" ? fecha(v) : esc(v);
const stat = (n, t) => `<div class="stat"><b>${n}</b><span>${t}</span></div>`;
const encabezado = (t, s) => `<h2>${t}</h2><p class="sub">${s}</p>`;

const VISTAS = {
  async dashboard() {
    const [p, c, v, k] = await Promise.all(["productos","clientes","ventas","caja_movimientos"].map(t => api(t)));
    const hoy = new Date().toDateString();
    const ventasHoy = v.filter(x => new Date(x.fecha).toDateString() === hoy).reduce((a,x) => a + Number(x.total), 0);
    const saldo = k.reduce((a,x) => a + (x.tipo === "Ingreso" ? 1 : -1) * Number(x.monto), 0);
    const bajo = p.filter(x => Number(x.stock) <= 5);
    return encabezado("Dashboard","Resumen de tu tienda") +
      `<div class="stats">${stat(money(ventasHoy),"Ventas de hoy")}${stat(bajo.length,"Productos con stock bajo (5 o menos)")}${stat(c.length,"Clientes registrados")}${stat(money(saldo),"Saldo en caja")}</div>` +
      `<div class="box"><b>Últimas ventas</b>${tablaHTML([["id","N°"],["fecha","Fecha","f"],["total","Total","$"]], v.slice(0,5))}</div>`;
  },
  async reportes() {
    const [p, v, k] = await Promise.all(["productos","ventas","caja_movimientos"].map(t => api(t)));
    const suma = (arr, f) => arr.reduce((a,x) => a + f(x), 0);
    return encabezado("Reportes","Totales de la tienda") + `<div class="stats">${
      stat(money(suma(v, x => Number(x.total))),"Total vendido")}${
      stat(money(suma(p, x => x.stock * x.precio)),"Valor del inventario")}${
      stat(money(suma(k.filter(x => x.tipo === "Ingreso"), x => Number(x.monto))),"Ingresos en caja")}${
      stat(money(suma(k.filter(x => x.tipo === "Egreso"), x => Number(x.monto))),"Egresos en caja")}</div>
      <div class="box vacio">Los reportes por rango de fechas se agregan en un siguiente paso.</div>`;
  }
};

function tablaHTML(cols, filas) {
  if (!filas.length) return `<p class="vacio">Aún no hay registros.</p>`;
  return `<table><tr>${cols.map(c => `<th>${c[1]}</th>`).join("")}</tr>${
    filas.map(f => `<tr>${cols.map(c => `<td>${celda(f[c[0]], c[2])}</td>`).join("")}</tr>`).join("")}</table>`;
}

async function vistaModulo(id) {
  const m = CFG[id], filas = await api(m.tabla);
  const campo = c => `<label>${c.l}${c.t === "select"
    ? `<select name="${c.k}">${c.op.map(o => `<option>${o}</option>`).join("")}</select>`
    : `<input name="${c.k}" type="${c.t || "text"}" ${c.t === "number" ? 'step="any"' : ""} ${c.req ? "required" : ""}>`}</label>`;
  return encabezado(m.nombre, m.sub) + `<div class="box">
    <div id="aviso"></div>
    <form class="fila" onsubmit="guardar(event,'${id}')">${m.campos.map(campo).join("")}<button>${m.boton}</button></form>
    ${tablaHTML(m.cols, filas)}</div>`;
}

async function guardar(ev, id) {
  ev.preventDefault();
  const m = CFG[id], datos = {};
  new FormData(ev.target).forEach((v, k) => { datos[k] = v === "" ? null : v; });
  try { await api(m.tabla, "POST", datos); mostrar(); }
  catch (e) { if (e.message === "AUTH") return mostrar(); document.getElementById("aviso").innerHTML = `<div class="msg">${error(e)}</div>`; }
}

function login(aviso = "") {
  document.getElementById("app").innerHTML = encabezado("Iniciar sesión","Escribe la clave de administrador") +
    `<div class="box login">${aviso}<form class="fila" onsubmit="entrar(event)">
      <label>Clave<input type="password" name="k" required autofocus></label><button>Entrar</button></form></div>`;
}
async function entrar(ev) {
  ev.preventDefault();
  sessionStorage.setItem("k", new FormData(ev.target).get("k"));
  try { await api("productos"); mostrar(); }
  catch (e) { login(`<div class="msg">${e.message === "AUTH" ? "La clave no es correcta." : error(e)}</div>`); }
}

async function mostrar() {
  const h = location.hash.slice(1);
  if (h === "salir") { sessionStorage.removeItem("k"); location.hash = "dashboard"; return; }
  const id = (h in CFG || h in VISTAS) ? h : "dashboard";
  const orden = ["dashboard","inventario","ventas","clientes","reportes","proveedores","caja"];
  const nombre = k => k === "dashboard" ? "Dashboard" : k === "reportes" ? "Reportes" : CFG[k].nombre;
  document.getElementById("menu").innerHTML = orden.map(k => `<a href="#${k}" class="${k === id ? "active" : ""}">${nombre(k)}</a>`).join("") + `<a href="#salir">Salir</a>`;
  document.title = nombre(id) + " · Mi Tienda";
  if (!sessionStorage.getItem("k")) return login();
  const app = document.getElementById("app");
  app.innerHTML = `<p class="sub">Cargando…</p>`;
  try { app.innerHTML = id in VISTAS ? await VISTAS[id]() : await vistaModulo(id); }
  catch (e) { if (e.message === "AUTH") return login(`<div class="msg">La clave no es correcta.</div>`); app.innerHTML = `<div class="msg">${error(e)}</div>`; }
}
addEventListener("hashchange", mostrar);
mostrar();
</script>
</body>
</html>
